name: Kompilacja Nexus Tools

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Inicjalizacja narzędzi Android SDK do kompilacji C++
    - name: Inicjalizacja Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'build-tools;34.0.0 platform-tools platforms;android-34'

    # 2. Kompilacja Twoich narzędzi sieciowych (Serwer + Klient)
    - name: Kompilacja kodu C++ na Androida
      run: |
        cmake -B build_output \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-26 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build_output

    # 3. Udostępnienie gotowych plików wykonywalnych na telefon (serwer i klient)
    - name: Udostępnij skompilowane narzędzia
      uses: actions/upload-artifact@v4
      with:
        name: nexus_network_binaries
        path: |
          build_output/**/nexus_server
          build_output/**/nexus_client
          
