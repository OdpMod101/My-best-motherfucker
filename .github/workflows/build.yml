name: Kompilacja Nexus Tools i APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Uruchomienie środowiska Java
    - name: Ustawienie Javy 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 2. Inicjalizacja pełnych narzędzi Android SDK
    - name: Inicjalizacja Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'build-tools;34.0.0 platform-tools platforms;android-34'

    # 3. Bezproblemowa kompilacja Twojego kodu C++ (Silnik + Narzędzia)
    - name: Kompilacja kodu C++ na Androida
      run: |
        cmake -B build_output \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-26 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build_output

    # 4. Profesjonalne pakowanie aplikacji przez AAPT2 z jawnymi flagami SDK
    - name: Pakowanie aplikacji AAPT2
      run: |
        mkdir -p out/assets out/lib/arm64-v8a
        
        # Kopiujemy silnik do folderu aplikacji, jeśli powstał
        cp build_output/libnexus_core.so out/lib/arm64-v8a/ 2>/dev/null || echo "Brak pliku silnika, pomijam."
        
        # W 100% poprawna komenda AAPT2 podająca minimalne i docelowe SDK
        $ANDROID_HOME/build-tools/34.0.0/aapt2 link \
          -I $ANDROID_HOME/platforms/android-34/android.jar \
          --manifest android/app/src/main/AndroidManifest.xml \
          --min-sdk-version 26 \
          --target-sdk-version 34 \
          -o out/NexusSDK_raw.apk \
          --allow-reserved-package-id

    # 5. Eksport wszystkich plików binarnych (APK + Narzędzia sieciowe)
    - name: Udostępnij skompilowane narzędzia
      uses: actions/upload-artifact@v4
      with:
        name: nexus_all_tools_android
        path: |
          out/NexusSDK_raw.apk
          build_output/**/nexus_server
          build_output/**/nexus_client
          
