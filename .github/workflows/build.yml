name: Kompilacja Nexus Tools i APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Uruchomienie środowiska Java (niezbędne do narzędzi pakujących)
    - name: Ustawienie Javy 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 2. Inicjalizacja czystych narzędzi Android SDK bez zbędnego Gradle
    - name: Inicjalizacja Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'build-tools;34.0.0 platform-tools platforms;android-34'

    # 3. Kompilacja całego projektu (Silnik + Narzędzia sieciowe) przez CMake i NDK
    - name: Kompilacja kodu C++ na Androida
      run: |
        cmake -B build_output \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-26 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build_output

    # 4. Pakowanie podstawowej aplikacji APK za pomocą AAPT2
    - name: Pakowanie aplikacji AAPT2
      run: |
        mkdir -p out/assets out/lib/arm64-v8a
        # Kopiujemy skompilowany silnik do folderu z bibliotekami programu
        cp build_output/libnexus_core.so out/lib/arm64-v8a/ 2>/dev/null || echo "Silnik budowany osobno"
        
        $ANDROID_HOME/build-tools/34.0.0/aapt2 link \
          -I $ANDROID_HOME/platforms/android-34/android.jar \
          --manifest android/app/src/main/AndroidManifest.xml \
          -o out/NexusSDK_raw.apk \
          --allow-reserved-package-id

    # 5. Eksport wszystkich gotowych plików binarnych (APK, Serwer, Klient) jako artefaktów
    - name: Udostępnij skompilowane narzędzia
      uses: actions/upload-artifact@v4
      with:
        name: nexus_all_tools_android
        path: |
          out/NexusSDK_raw.apk
          build_output/02_Device_Manager/nexus_server
          build_output/02_Device_Manager/nexus_client
          
